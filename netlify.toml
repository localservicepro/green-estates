[build]
  publish = "public"
  command = "python3 scripts/build-images.py && python3 src/build.py"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old Wix URLs had no trailing slash. Every one must 301 to its slashed equivalent in one hop
# (review v2, blocker 2). Netlify's pretty-URL handling would do this with a 301 as well, but the
# explicit rules make the behaviour independent of site settings.
[[redirects]]
  from = "https://www.greenestatesgardening.com.au/*"
  to = "https://greenestatesgardening.com.au/:splat"
  status = 301
  force = true

